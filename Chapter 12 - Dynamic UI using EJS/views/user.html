<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration</title>
  <!-- Link compiled Tailwind CSS -->
  <link rel="stylesheet" href="/css/output.css">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    <h1 class="text-2xl text-center font-bold text-gray-900 mb-1">Home Registration</h1>
    <br>
    <form action="/user/welcome-msg" method="POST" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1"></label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          placeholder="Enter your home name" 
          required 
          class="w-full px-3.5 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent transition"
        >
      </div>
      <button 
        type="submit" 
        class="w-full py-2.5 px-4 bg-rose-500 hover:bg-rose-600 text-white font-medium rounded-lg transition cursor-pointer text-sm"
      >
        Submit
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-gray-100 text-center">
      <a href="/" class="text-sm text-gray-500 hover:text-rose-500 transition">← Back to Homepage</a>
    </div>
  </main>
</body>
</html>
